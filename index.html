<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <meta name="theme-color" content="#08101d">

    <title>Wizarding World 3D</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="game"></div>


    <!-- ================================
         HUD
    ================================= -->

    <div id="hud">

        <div class="title">
            WIZARDING WORLD 3D
        </div>

        <div class="subtitle">
            ✦ Hogwarts Valley
        </div>

        <div class="stat">
            ❤️ HP:
            <span id="hp">100</span>
        </div>

        <div class="stat">
            🪄 Magic:
            <span id="magic">100</span>
        </div>

        <div class="stat">
            ⭐ XP:
            <span id="xp">0</span>
        </div>

    </div>


    <!-- ================================
         CROSSHAIR
    ================================= -->

    <div id="crosshair">
        +
    </div>


    <!-- ================================
         MESSAGE
    ================================= -->

    <div id="message">
        Explore the magical valley!
    </div>


    <!-- ================================
         QUEST
    ================================= -->

    <div id="quest">

        <div class="questTitle">
            ✦ QUEST
        </div>

        <div id="questText">
            Explore the castle courtyard
        </div>

    </div>


    <!-- ================================
         MOBILE CONTROLS
    ================================= -->

    <div id="controls">


        <!-- JOYSTICK -->

        <div id="joystick">

            <div id="joystickBase">

                <div id="joystickKnob"></div>

            </div>

        </div>


        <!-- ACTIONS -->

        <div id="actions">

            <button
                id="jump"
                class="gameButton"
            >

                <span>⬆</span>

                <small>
                    JUMP
                </small>

            </button>


            <button
                id="spell"
                class="gameButton spellButton"
            >

                <span>🪄</span>

                <small>
                    SPELL
                </small>

            </button>

        </div>

    </div>


    <!-- ================================
         CAMERA HELP
    ================================= -->

    <div id="cameraHint">
        Drag the screen to look around
    </div>


    <!-- ================================
         PORTRAIT SCREEN
    ================================= -->

    <div id="rotateScreen">

        <div class="phoneIcon">
            📱
        </div>

        <h2>
            Rotate Your Phone
        </h2>

        <p>
            Wizarding World 3D is designed
            for landscape mode.
        </p>

    </div>


    <!-- ================================
         THREE.JS
    ================================= -->

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

    <script src="game.js"></script>

</body>

</html>
