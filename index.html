<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Aetheria Academy</title>

<link
    rel="stylesheet"
    href="style.css?v=20"
>


<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07101c;
}

body {
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at center,
            #15243a,
            #050b13 70%
        );

    color: white;

    transition:
        opacity 0.6s ease;
}

#loading h1 {
    font-size: 54px;
    letter-spacing: 12px;
    margin: 20px 0 5px;
}

#loading p {
    font-size: 22px;
    letter-spacing: 6px;
    opacity: 0.7;
}

#loadingBar {
    width: 55%;
    max-width: 700px;
    height: 14px;

    margin-top: 50px;

    background: #29313c;
    border-radius: 20px;
    overflow: hidden;
}

#loadingProgress {
    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #79dfff
        );

    animation:
        loading 1.2s infinite
        alternate;
}

@keyframes loading {

    from {
        width: 35%;
    }

    to {
        width: 95%;
    }
}

#questBox {
    position: fixed;
    right: 22px;
    top: 22px;

    z-index: 20;

    padding: 18px 28px;

    border-radius: 22px;

    color: white;

    background:
        rgba(10, 20, 32, 0.88);

    border:
        1px solid
        rgba(255,255,255,0.12);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,0.35);

    font-size: 20px;
}

#questText {
    margin-bottom: 5px;
}

#xp {
    opacity: 0.8;
}

#joystick {
    position: fixed;

    left: 28px;
    bottom: 28px;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    z-index: 30;

    background:
        rgba(255,255,255,0.10);

    border:
        2px solid
        rgba(255,255,255,0.25);
}

#joystick::after {
    content: "";

    position: absolute;

    width: 70px;
    height: 70px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:
        rgba(255,255,255,0.85);

    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.35);
}

#jumpButton,
#castButton {

    position: fixed;

    z-index: 30;

    width: 105px;
    height: 105px;

    border-radius: 50%;

    border: 2px solid
        rgba(255,255,255,0.2);

    color: white;

    font-size: 28px;

    background:
        rgba(20,25,35,0.8);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.35);
}

#jumpButton {
    right: 45px;
    bottom: 42px;
}

#castButton {
    right: 165px;
    bottom: 95px;
}

#jumpButton:active,
#castButton:active {
    transform: scale(0.92);
}

</style>

</head>


<body>


<!-- =====================================================
     LOADING
     ===================================================== -->

<div id="loading">

    <div style="font-size:55px;">
        ✦
    </div>

    <h1>
        AETHERIA
    </h1>

    <p>
        Academy of Arcane Arts
    </p>

    <div id="loadingBar">
        <div id="loadingProgress"></div>
    </div>

    <div style="
        margin-top:25px;
        font-size:22px;
        opacity:0.7;
    ">
        Loading magical world...
    </div>

</div>


<!-- =====================================================
     QUEST
     ===================================================== -->

<div id="questBox">

    <div id="questText">
        Quest: Talk to Professor Aelion
    </div>

    <div id="xp">
        XP: 0
    </div>

</div>


<!-- =====================================================
     CONTROLS
     ===================================================== -->

<div id="joystick"></div>

<button id="castButton">
    ✦
</button>

<button id="jumpButton">
    ↑
</button>


<!-- =====================================================
     THREE.JS
     ===================================================== -->

<script type="importmap">

{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
}

</script>


<script
    type="module"
    src="game.js?v=20">
</script>


</body>

</html>
