<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Aetheria Academy</title>

    <link
        rel="stylesheet"
        href="style.css?v=20"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050914;
        }

        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #14233c 0%,
                    #070d18 48%,
                    #02050a 100%
                );

            color: white;

            transition:
                opacity 0.7s ease;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-star {
            font-size: 70px;
            margin-bottom: 30px;

            animation:
                magicPulse 1.8s
                infinite ease-in-out;
        }

        .loading-title {
            font-family: Arial, sans-serif;

            font-size: 48px;
            font-weight: 700;

            letter-spacing: 14px;

            margin-bottom: 15px;
        }

        .loading-subtitle {
            font-family: Arial, sans-serif;

            font-size: 22px;

            letter-spacing: 7px;

            color: #bfc5d0;

            margin-bottom: 55px;
        }

        .loading-bar {
            width: min(70vw, 700px);
            height: 14px;

            background: #29313f;

            border-radius: 20px;

            overflow: hidden;
        }

        #loadingProgress {
            width: 8%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #9edfff
                );

            border-radius: 20px;

            transition:
                width 0.3s ease;
        }

        #loadingText {
            margin-top: 25px;

            font-family: Arial, sans-serif;

            font-size: 22px;

            color: #bfc5d0;
        }

        @keyframes magicPulse {

            0% {
                transform: scale(1);
                opacity: 0.75;
            }

            50% {
                transform: scale(1.12);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0.75;
            }

        }

        #portraitOverlay {
            position: fixed;
            inset: 0;

            z-index: 100000;

            display: none;

            align-items: center;
            justify-content: center;

            background: #050914;

            color: white;

            font-family: Arial, sans-serif;

            text-align: center;

            padding: 30px;
        }

    </style>

</head>


<body>


    <!-- =================================================
         LOADING SCREEN
         ================================================= -->

    <div id="loadingScreen">

        <div class="loading-star">
            ✦
        </div>

        <div class="loading-title">
            AETHERIA
        </div>

        <div class="loading-subtitle">
            Academy of Arcane Arts
        </div>

        <div class="loading-bar">

            <div
                id="loadingProgress">
            </div>

        </div>

        <div id="loadingText">
            Starting magical world...
        </div>

    </div>


    <!-- =================================================
         PORTRAIT WARNING
         ================================================= -->

    <div id="portraitOverlay">

        <div>

            <h2>
                Rotate Your Device
            </h2>

            <p>
                Aetheria Academy is designed
                for landscape mode.
            </p>

        </div>

    </div>


    <!-- =================================================
         HUD
         ================================================= -->

    <div id="hud">

        <div id="questBox">

            <div id="questText">
                Quest: Talk to Professor Aelion
            </div>

            <div id="xpText">
                XP: 0
            </div>

        </div>

    </div>


    <!-- =================================================
         DIALOGUE
         ================================================= -->

    <div
        id="dialogue"
        style="display:none;"
    >

        <div id="dialogueText">
        </div>

    </div>


    <!-- =================================================
         JOYSTICK
         ================================================= -->

    <div id="joystick">

        <div id="joystickKnob">
        </div>

    </div>


    <!-- =================================================
         ACTION BUTTONS
         ================================================= -->

    <button id="jumpButton">
        ↑
    </button>


    <button id="castButton">
        ✦
    </button>


    <button id="talkButton">
        💬
    </button>


    <!-- =================================================
         THREE.JS IMPORT MAP
         ================================================= -->

    <script type="importmap">

    {
        "imports": {

            "three":
            "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"

        }
    }

    </script>


    <!-- =================================================
         SAFETY LOADING FAILSAFE
         ================================================= -->

    <script>

        /*
         * IMPORTANT:
         * Even if the 3D character takes a long time
         * to download, never leave the user stuck
         * on the loading screen forever.
         */

        window.gameLoadingStarted =
            Date.now();


        window.forceStartGame =
            function() {

                const screen =
                    document.getElementById(
                        "loadingScreen"
                    );

                if (!screen) return;

                screen.classList.add(
                    "hidden"
                );

                setTimeout(
                    function() {

                        screen.style.display =
                            "none";

                    },
                    800
                );

            };


        /*
         * Maximum loading-screen wait:
         * 8 seconds.
         */

        setTimeout(
            function() {

                console.log(
                    "Loading failsafe activated."
                );

                window.forceStartGame();

            },
            8000
        );

    </script>


    <!-- =================================================
         GAME
         ================================================= -->

    <script
        type="module"
        src="game.js?v=20"
    ></script>


</body>

</html>
