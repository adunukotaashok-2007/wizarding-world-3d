<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>Wizarding World 3D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game"></div>

    <!-- Game information -->
    <div id="hud">

        <div id="title">
            WIZARDING WORLD 3D
        </div>

        <div id="status">
            HP: 100
            <br>
            Magic: 100
        </div>

    </div>

    <!-- Mobile controls -->
    <div id="controls">

        <button id="up">▲</button>

        <div class="middle-controls">

            <button id="left">◀</button>

            <button id="down">▼</button>

            <button id="right">▶</button>

        </div>

        <button id="spell">
            🪄 SPELL
        </button>

    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

    <script src="game.js"></script>

</body>
</html>
