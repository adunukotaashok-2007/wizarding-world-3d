<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
  >

  <meta name="theme-color" content="#05070b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Aetheria Academy</title>

  <link rel="stylesheet" href="./style.css?v=6">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <!-- GAME -->
  <div id="game"></div>


  <!-- LOADING -->
  <div id="loading">

    <div class="loading-box">

      <div class="magic-symbol">✦</div>

      <h1>AETHERIA</h1>

      <p>Academy of Arcane Arts</p>

      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>

      <span>Loading world...</span>

    </div>

  </div>


  <!-- PORTRAIT WARNING -->
  <div id="rotateOverlay">

    <div class="rotate-box">

      <div class="phone-icon">📱</div>

      <div class="rotate-arrow">↻</div>

      <h2>Rotate Your Phone</h2>

      <p>
        Aetheria Academy is designed<br>
        for <b>landscape mode</b>.
      </p>

    </div>

  </div>


  <!-- HUD -->
  <div id="hud">

    <div id="academyTitle">

      <div class="title-small">
        AETHERIA
      </div>

      <div class="title-large">
        ACADEMY
      </div>

    </div>


    <!-- QUEST -->
    <div id="questBox">

      <div class="quest-heading">
        CURRENT QUEST
      </div>

      <div id="quest">
        Quest: Meet the Academy Guide
      </div>

    </div>


    <!-- XP -->
    <div id="xpBox">

      <span id="xpLabel">
        XP
      </span>

      <span id="xpValue">
        0
      </span>

    </div>


    <!-- MESSAGE -->
    <div id="message"></div>


    <!-- NPC NAME -->
    <div id="npcName">
      Academy Guide
    </div>


    <!-- DIALOGUE -->
    <div id="dialogueBox">

      <div id="dialogueName">
        Academy Guide
      </div>

      <div id="dialogueText">
        Welcome to Aetheria Academy.
      </div>

      <button id="dialogueNext">
        CONTINUE
      </button>

    </div>

  </div>


  <!-- TALK BUTTON -->
  <button id="talkBtn">
    <span>💬</span>
    <small>TALK</small>
  </button>


  <!-- JOYSTICK -->
  <div id="joystickBase">

    <div id="joystickStick"></div>

  </div>


  <!-- ACTION BUTTONS -->
  <div id="actionButtons">

    <button
      id="jumpBtn"
      class="actionBtn"
    >
      <span>↑</span>
      <small>JUMP</small>
    </button>


    <button
      id="spellBtn"
      class="actionBtn spell"
    >
      <span>✦</span>
      <small>CAST</small>
    </button>

  </div>


  <script
    type="module"
    src="./game.js?v=6"
  ></script>

</body>
</html>
