<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Wizarding World 3D</title>

  <link rel="stylesheet" href="./style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <div id="loading">
    <div class="loading-title">WIZARDING WORLD 3D</div>
    <div class="loading-text">Loading magical world...</div>
  </div>

  <div id="game">

    <div id="topHud">
      <div class="title">WIZARDING WORLD 3D</div>

      <div class="bars">

        <div class="bar-row">
          <span>HP</span>
          <div class="bar">
            <div id="hpBar"></div>
          </div>
          <span id="hpText">100</span>
        </div>

        <div class="bar-row">
          <span>MAGIC</span>
          <div class="bar">
            <div id="magicBar"></div>
          </div>
          <span id="magicText">100</span>
        </div>

        <div class="xp">
          XP: <span id="xpText">0</span>
        </div>

      </div>
    </div>

    <div id="quest">
      <b>QUEST</b>
      <br>
      Explore the magical valley
    </div>

    <div id="message"></div>

    <div id="joystickBase">
      <div id="joystickStick"></div>
    </div>

    <button id="jumpBtn">JUMP</button>
    <button id="spellBtn">SPELL</button>

  </div>

  <script type="module" src="./game.js"></script>

</body>
</html>
