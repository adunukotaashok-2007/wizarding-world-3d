<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Wizarding World 3D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game"></div>

    <div id="hud">
        <div class="game-title">WIZARDING WORLD 3D</div>

        <div class="stats">
            ❤️ HP: <span id="hp">100</span>
            <br>
            🪄 Magic: <span id="magic">100</span>
        </div>
    </div>

    <div id="landscape-message">
        <div>📱</div>
        <h2>Rotate Your Phone</h2>
        <p>Please use landscape mode for the best experience.</p>
    </div>

    <div id="controls">

        <div class="movement">

            <button id="up">▲</button>

            <div class="horizontal">
                <button id="left">◀</button>
                <button id="down">▼</button>
                <button id="right">▶</button>
            </div>

        </div>

        <button id="spell">🪄 SPELL</button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

    <script src="game.js"></script>

</body>
</html>
