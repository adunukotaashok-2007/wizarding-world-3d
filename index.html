<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <meta name="theme-color" content="#070b18">

    <title>Wizarding World 3D</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =================================================
         GAME
    ================================================== -->

    <div id="game"></div>


    <!-- =================================================
         HUD
    ================================================== -->

    <div id="hud">

        <div class="title">
            WIZARDING WORLD 3D
        </div>

        <div class="stats">

            ❤️ HP:
            <span id="hp">100</span>

            <br>

            🪄 Magic:
            <span id="magic">100</span>

        </div>

    </div>


    <!-- =================================================
         PORTRAIT WARNING
    ================================================== -->

    <div id="rotateScreen">

        <div class="rotateIcon">
            📱
        </div>

        <h2>
            Rotate Your Phone
        </h2>

        <p>
            Please rotate your phone to landscape mode.
        </p>

    </div>


    <!-- =================================================
         MOBILE CONTROLS
    ================================================== -->

    <div id="controls">

        <div id="movement">

            <button
                id="up"
                class="controlButton"
            >
                ▲
            </button>

            <div class="horizontal">

                <button
                    id="left"
                    class="controlButton"
                >
                    ◀
                </button>

                <button
                    id="down"
                    class="controlButton"
                >
                    ▼
                </button>

                <button
                    id="right"
                    class="controlButton"
                >
                    ▶
                </button>

            </div>

        </div>


        <button
            id="spell"
            class="spellButton"
        >
            🪄 SPELL
        </button>

    </div>


    <!-- =================================================
         THREE.JS
    ================================================== -->

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

    <script src="game.js"></script>

</body>

</html>
