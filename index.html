<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <meta name="theme-color" content="#07101f">

    <title>Wizarding World 3D</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ==================================================
         GAME
    =================================================== -->

    <div id="game"></div>


    <!-- ==================================================
         HUD
    =================================================== -->

    <div id="hud">

        <div class="gameTitle">
            WIZARDING WORLD 3D
        </div>

        <div class="location">
            ✦ Hogwarts Valley
        </div>

        <div class="stats">

            ❤️ HP:
            <span id="hp">100</span>

            <br>

            🪄 Magic:
            <span id="magic">100</span>

        </div>

    </div>


    <!-- ==================================================
         MESSAGE
    =================================================== -->

    <div id="message">
        Welcome, young wizard!
    </div>


    <!-- ==================================================
         PORTRAIT SCREEN
    =================================================== -->

    <div id="rotateScreen">

        <div class="rotateIcon">
            📱
        </div>

        <h2>
            Rotate Your Phone
        </h2>

        <p>
            This game is designed for landscape mode.
        </p>

    </div>


    <!-- ==================================================
         MOBILE CONTROLS
    =================================================== -->

    <div id="controls">


        <!-- JOYSTICK -->

        <div id="joystick">

            <div id="joystickBase">

                <div id="joystickKnob"></div>

            </div>

        </div>


        <!-- ACTION BUTTONS -->

        <div id="actions">

            <button
                id="jump"
                class="actionButton"
            >
                ⬆
                <small>JUMP</small>
            </button>


            <button
                id="spell"
                class="spellButton"
            >
                🪄
                <small>CAST</small>
            </button>

        </div>

    </div>


    <!-- ==================================================
         CAMERA INSTRUCTION
    =================================================== -->

    <div id="cameraHint">
        Drag the screen to look around
    </div>


    <!-- ==================================================
         THREE.JS
    =================================================== -->

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

    <script src="game.js"></script>

</body>

</html>
