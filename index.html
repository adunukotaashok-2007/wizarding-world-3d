<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>Aetheria Academy</title>

    <link rel="stylesheet" href="./style.css">

</head>


<body>

    <!-- =====================================================
         GAME
    ====================================================== -->

    <div id="game"></div>


    <!-- =====================================================
         LOADING SCREEN
    ====================================================== -->

    <div id="loading">

        <div class="loadingLogo">
            ✦
        </div>

        <div class="loadingTitle">
            AETHERIA
        </div>

        <div class="loadingSubtitle">
            Academy of Arcane Arts
        </div>

        <div class="loadingBar">
            <div class="loadingBarFill"></div>
        </div>

        <div class="loadingText">
            Loading world...
        </div>

    </div>


    <!-- =====================================================
         PORTRAIT WARNING
    ====================================================== -->

    <div id="portraitOverlay">

        <div class="portraitCard">

            <div class="rotateIcon">
                ↔
            </div>

            <h1>
                AETHERIA
            </h1>

            <h2>
                Rotate Your Device
            </h2>

            <p>
                This magical world is designed for landscape mode.
            </p>

            <button id="landscapeButton">
                ENTER LANDSCAPE
            </button>

        </div>

    </div>


    <!-- =====================================================
         HUD
    ====================================================== -->

    <div id="hud">


        <!-- =================================================
             TITLE
        ================================================== -->

        <div id="academyTitle">

            <div>
                A E T H E R I A
            </div>

            <strong>
                ACADEMY
            </strong>

        </div>


        <!-- =================================================
             QUEST
        ================================================== -->

        <div id="questBox">

            <div class="questLabel">
                CURRENT QUEST
            </div>

            <div id="questText">
                Quest: Find the Ancient Academy Marker
            </div>

        </div>


        <!-- =================================================
             XP
        ================================================== -->

        <div id="xp">
            <span id="xpText">XP 0</span>
        </div>


        <!-- =================================================
             CAMERA TOUCH AREA
        ================================================== -->

        <div id="cameraTouchArea"></div>


        <!-- =================================================
             JOYSTICK
        ================================================== -->

        <div id="joystick">

            <div id="joystickKnob"></div>

        </div>


        <!-- =================================================
             JUMP
        ================================================== -->

        <button
            id="jumpButton"
            type="button"
        >

            <span class="buttonIcon">
                ↑
            </span>

            <span>
                JUMP
            </span>

        </button>


        <!-- =================================================
             CAST
        ================================================== -->

        <button
            id="spellButton"
            type="button"
        >

            <span class="buttonIcon">
                ✦
            </span>

            <span>
                CAST
            </span>

        </button>


        <!-- =================================================
             TALK
        ================================================== -->

        <button
            id="interactButton"
            type="button"
        >
            TALK
        </button>


        <!-- =================================================
             DIALOGUE
        ================================================== -->

        <div id="dialogueBox"></div>


    </div>


    <!-- =====================================================
         GAME SCRIPT
    ====================================================== -->

    <script
        type="module"
        src="./game.js?v=20">
    </script>


</body>

</html>
